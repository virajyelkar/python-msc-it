{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="theme-corner">
        {% if theme == "dark" %}
            <a class="pill" href="/set-theme/light">☀️ Light</a>
        {% else %}
            <a class="pill" href="/set-theme/dark">🌙 Dark</a>
        {% endif %}
    </div>

    <div class="card auth-card">
        <div class="logo-icon">✓</div>
        <h1>Personal Task Tracker</h1>
        <p class="subtitle">Enter your name to see your tasks.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="field">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Hasmukh" maxlength="100" required autofocus>
            </div>
            <button type="submit" class="btn-primary">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
