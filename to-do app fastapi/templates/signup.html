<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #6D28D9; --accent2: #2563EB; --text: #1B1B33; --text-muted: #6B6B8A; --border: #ECEAF7; --bg: #F4F5FB; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            background: radial-gradient(circle at 10% 10%, rgba(109,40,217,0.10), transparent 32%),
                        radial-gradient(circle at 90% 90%, rgba(37,99,235,0.10), transparent 32%), var(--bg);
        }
        .card { background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(109,40,217,0.12); padding: 36px; width: 100%; max-width: 380px; }
        .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #7C3AED, #2563EB); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 19px; margin-bottom: 16px; }
        h1 { font-family: 'Poppins', sans-serif; font-size: 20px; margin-bottom: 6px; }
        p.subtitle { color: var(--text-muted); font-size: 13.5px; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12.5px; color: var(--text-muted); }
        input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px #EFE9FE; }
        button { width: 100%; padding: 12px; margin-top: 6px; background: linear-gradient(135deg, #7C3AED, #2563EB); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Poppins', sans-serif; }
        .error { background: #FFE9EC; color: #E11D48; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
        .switch { text-align: center; margin-top: 18px; font-size: 13.5px; color: var(--text-muted); }
        .switch a { color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">✓</div>
        <h1>Create your account</h1>
        <p class="subtitle">Start organizing your tasks.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/signup" method="POST">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Sign Up</button>
        </form>

        <div class="switch">Already have an account? <a href="/login">Log in</a></div>
    </div>
</body>
</html>
