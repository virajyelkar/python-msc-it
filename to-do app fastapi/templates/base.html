<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Tracker{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F5FB; --card: #FFFFFF; --text: #1B1B33; --text-muted: #6B6B8A; --text-faint: #9A9AB8;
            --border: #ECEAF7; --input-bg: #FBFBFF; --accent: #6D28D9; --accent-soft: #EFE9FE;
            --success-bg: #E4F9EE; --success-text: #0F9D58; --success-border: #A8EAC4;
            --warn-bg: #FFF4DF; --warn-text: #C77700; --warn-border: #FFDFA0;
            --danger-bg: #FFE9EC; --danger-text: #E11D48; --danger-border: #FFC2CC;
            --shadow: 0 4px 16px rgba(109,40,217,0.06);
            --radius: 16px; --radius-sm: 10px;
        }
        [data-theme="dark"] {
            --bg: #0F1020; --card: #17182E; --text: #ECECF8; --text-muted: #A5A6C4; --text-faint: #7C7DA0;
            --border: #2A2B4A; --input-bg: #1E1F3A; --accent: #A78BFA; --accent-soft: rgba(167,139,250,0.16);
            --success-bg: rgba(16,185,129,0.15); --success-text: #34D399; --success-border: rgba(16,185,129,0.35);
            --warn-bg: rgba(245,158,11,0.15); --warn-text: #FBBF24; --warn-border: rgba(245,158,11,0.35);
            --danger-bg: rgba(244,63,94,0.15); --danger-text: #FB7185; --danger-border: rgba(244,63,94,0.35);
            --shadow: 0 4px 16px rgba(0,0,0,0.35);
            color-scheme: dark;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            color: var(--text); min-height: 100vh; padding: 40px 20px 80px; position: relative; overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(circle at 8% 8%, rgba(109,40,217,0.10), transparent 32%),
                radial-gradient(circle at 95% 12%, rgba(37,99,235,0.10), transparent 32%),
                var(--bg);
        }
        .wrapper { max-width: 900px; margin: 0 auto; }

        .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 13px; }
        .logo-icon {
            width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #7C3AED, #2563EB);
            box-shadow: 0 6px 16px rgba(109,40,217,0.35); display: flex; align-items: center; justify-content: center;
            font-size: 19px; color: #fff; flex-shrink: 0;
        }
        .header-left h1 { font-family: 'Poppins', sans-serif; font-size: 21px; }
        .header-left p { font-size: 13px; color: var(--text-muted); margin-top: 1px; }
        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .pill {
            font-size: 13px; font-weight: 600; color: var(--text-muted); background: var(--card);
            border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; text-decoration: none;
            box-shadow: var(--shadow);
        }
        a.pill:hover { border-color: var(--accent); color: var(--accent); }
        .pill strong.pending-num { color: var(--warn-text); }
        .pill strong.completed-num { color: var(--success-text); }
        .pill.logout { color: var(--danger-text); }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
        .form-card { padding: 26px 28px; margin-bottom: 34px; }
        .form-title { font-family: 'Poppins', sans-serif; font-size: 16px; margin-bottom: 18px; color: var(--accent); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-grid .full { grid-column: span 2; }
        .field label { display: block; margin-bottom: 6px; color: var(--text-muted); font-weight: 600; font-size: 12.5px; }
        input[type="text"], select, textarea {
            width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; color: var(--text); background: var(--input-bg); outline: none; font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        textarea { resize: vertical; min-height: 46px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
        select { cursor: pointer; }

        .btn-primary {
            padding: 12px 22px; background: linear-gradient(135deg, #7C3AED, #2563EB); color: #fff; border: none;
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Poppins', sans-serif;
            box-shadow: 0 6px 16px rgba(109,40,217,0.30); transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(109,40,217,0.4); }
        .btn-secondary {
            padding: 12px 22px; background: var(--card); color: var(--text-muted); border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; text-align: center; text-decoration: none;
            display: inline-block;
        }
        .btn-secondary:hover { background: var(--accent-soft); color: var(--accent); }
        .form-grid .btn-primary { grid-column: span 2; justify-self: start; }

        .section-heading { display: flex; align-items: center; gap: 9px; margin: 28px 0 14px; }
        .section-heading h2 { font-family: 'Poppins', sans-serif; font-size: 16px; }
        .count-pill { font-size: 12px; font-weight: 700; padding: 2px 11px; border-radius: 20px; }
        .count-pill.pending { background: var(--warn-bg); color: var(--warn-text); }
        .count-pill.completed { background: var(--success-bg); color: var(--success-text); }

        .task-card {
            padding: 17px 22px; margin-bottom: 12px; display: flex; justify-content: space-between;
            align-items: center; gap: 16px; border-left: 4px solid var(--border);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .task-card:hover { transform: translateY(-2px); }
        .task-card.p-High { border-left-color: #F43F5E; }
        .task-card.p-Medium { border-left-color: #F59E0B; }
        .task-card.p-Low { border-left-color: #10B981; }
        .task-card.completed { opacity: 0.7; }
        .task-card.completed h3 { text-decoration: line-through; color: var(--text-faint); }

        .task-info { flex: 1; min-width: 0; }
        .task-title-row { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; flex-wrap: wrap; }
        .task-info h3 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
        .task-info p.desc { color: var(--text-muted); font-size: 13px; margin-bottom: 7px; line-height: 1.45; overflow-wrap: anywhere; }
        .task-info p.meta { color: var(--text-faint); font-size: 12px; font-weight: 500; }

        .priority-tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid transparent; }
        .priority-High { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
        .priority-Medium { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
        .priority-Low { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }

        .actions { display: flex; gap: 7px; flex-shrink: 0; }
        .actions a, .actions button {
            border: 1.5px solid var(--border); background: var(--card); padding: 8px 13px; border-radius: var(--radius-sm);
            font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--text-muted);
            transition: all 0.15s ease; font-family: inherit;
        }
        .btn-toggle:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .btn-edit:hover { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
        .btn-delete:hover { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }

        .empty { text-align: center; padding: 34px 20px; background: var(--card); border: 2px dashed var(--border); border-radius: var(--radius); }
        .empty .icon { font-size: 24px; margin-bottom: 8px; }
        .empty .title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .empty .subtitle { font-size: 12.5px; color: var(--text-faint); }

        .auth-wrap { min-height: 78vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .auth-card { width: 100%; max-width: 380px; padding: 36px; }
        .auth-card .logo-icon { margin-bottom: 16px; }
        .auth-card h1 { font-family: 'Poppins', sans-serif; font-size: 20px; margin-bottom: 6px; }
        .auth-card p.subtitle { color: var(--text-muted); font-size: 13.5px; margin-bottom: 22px; }
        .auth-card .btn-primary { width: 100%; margin-top: 6px; }
        .error { background: var(--danger-bg); color: var(--danger-text); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
        .theme-corner { position: absolute; top: 0; right: 0; }
        .edit-card { max-width: 460px; margin: 6vh auto 0; padding: 32px; }
        .edit-card h1 { font-family: 'Poppins', sans-serif; font-size: 18px; margin-bottom: 20px; color: var(--accent); }
        .field { margin-bottom: 16px; }
        .btn-row { display: flex; gap: 10px; margin-top: 8px; }
        .btn-row > * { flex: 1; }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-grid .full, .form-grid .btn-primary { grid-column: span 1; }
            .form-grid .btn-primary { width: 100%; justify-self: stretch; }
            .task-card { flex-direction: column; align-items: flex-start; }
            .actions { width: 100%; }
            .actions a, .actions button { flex: 1; text-align: center; }
            .actions form { flex: 1; display: flex; }
            .top-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
