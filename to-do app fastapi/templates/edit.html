<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F4F5FB;
            --text: #1B1B33;
            --text-muted: #6B6B8A;
            --accent: #6D28D9;
            --accent-soft: #EFE9FE;
            --card: #FFFFFF;
            --border: #ECEAF7;
            --radius: 16px;
            --radius-sm: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
            background:
                radial-gradient(circle at 8% 8%, rgba(109,40,217,0.10), transparent 32%),
                radial-gradient(circle at 95% 90%, rgba(37,99,235,0.10), transparent 32%),
                var(--bg);
        }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(109,40,217,0.12);
            padding: 34px; width: 100%; max-width: 420px;
        }
        h1 { font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 22px; color: var(--accent); }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-weight: 600; font-size: 12.5px; }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; color: var(--text); background: #FBFBFF; outline: none; font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        textarea { resize: vertical; min-height: 56px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
        .btn-row { display: flex; gap: 10px; margin-top: 8px; }
        button.save-btn {
            flex: 1; padding: 12px; background: linear-gradient(135deg, #7C3AED, #2563EB); color: #fff; border: none;
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 6px 16px rgba(109,40,217,0.30);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button.save-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(109,40,217,0.4); }
        a.cancel-btn {
            flex: 1; padding: 12px; background: #fff; border: 1.5px solid var(--border); color: var(--text-muted);
            border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; text-align: center; text-decoration: none;
            transition: background 0.15s ease;
        }
        a.cancel-btn:hover { background: #F2F1FA; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✎ Edit Task</h1>
        <form action="/update/{{ task.id }}" method="POST">
            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ task.title }}" required>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description">{{ task.description or '' }}</textarea>
            </div>
            <div class="field">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="High" {% if task.priority == "High" %}selected{% endif %}>🔴 High</option>
                    <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>🟠 Medium</option>
                    <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>🟢 Low</option>
                </select>
            </div>
            <div class="field">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" value="{{ task.due_date }}" required>
            </div>
            <div class="btn-row">
                <a href="/" class="cancel-btn">Cancel</a>
                <button type="submit" class="save-btn">Save Changes</button>
            </div>
        </form>
    </div>
</body>
</html>
